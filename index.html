<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Audio Poem</title>
    <style>
        /* Plain, low-effort aesthetics matching the minimalist target style */
        body {
            background-color: #ffffff;
            margin: 0;
            padding: 0;
            font-family: "Times New Roman", Times, serif;
            color: #000000;
        }

        #page-wrapper {
            width: 100%;
            margin: 0 auto;
            background-color: #ffffff;
            padding: 0;
        }

        #inner-frame {
            background-color: #ffffff;
            padding: 0;
            text-align: center;
            position: relative;
        }

        /* Minimal loading screen */
        #loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }

        .loading-box {
            background: #ffffff;
            padding: 20px;
            text-align: center;
            width: 320px;
        }

        .loading-box h1 {
            font-size: 24px;
            margin-bottom: 15px;
            font-weight: normal;
            color: #000000;
        }

        .progress-container {
            width: 100%;
            height: 16px;
            background: #ffffff;
            border: 1px solid #000000;
            margin-top: 15px;
            position: relative;
        }

        .progress-bar {
            width: 0%;
            height: 100%;
            background: #2bb62d;
        }

        /* Snap-reveal Overlays */
        .snap-tile {
            position: absolute;
            background-color: #ffffff;
            z-index: 1000;
            pointer-events: none;
        }

        #tile-half { top: 0; left: 0; width: 50%; height: 100%; }
        #tile-quarter { top: 0; right: 0; width: 25%; height: 100%; }
        #tile-eighth-1 { top: 0; left: 50%; width: 12.5%; height: 100%; }
        #tile-eighth-2 { top: 0; left: 62.5%; width: 12.5%; height: 100%; }

        /* Main Content */
        #main-content {
            display: none;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        .page-title {
            font-size: 28px;
            margin: 25px 0 10px 0;
            font-weight: normal;
        }

        /* Plain Poem Display Area */
        .poem-container {
            font-size: 22px;
            line-height: 2;
            margin: 20px 0;
            background: #ffffff;
            padding: 10px;
            width: 90%;
            max-width: 600px;
            text-align: center;
        }

        .poem-line {
            display: block;
            cursor: pointer;
            padding: 4px;
            margin: 2px 0;
            transition: color 0.1s ease;
        }

        .poem-line:hover {
            color: #2bb62d;
            text-decoration: underline;
        }

        .poem-line.playing {
            color: #1f8a20;
            font-weight: bold;
        }

        .controls {
            margin-top: 10px;
        }

        /* Glossy Pill Play Button Style */
        .btn {
            background: linear-gradient(to bottom, #52d053 0%, #2bb62d 50%, #1f8a20 100%);
            border: 2px solid #ffffff;
            outline: 1px solid #1f8a20;
            border-radius: 25px;
            padding: 10px 30px;
            cursor: pointer;
            color: #ffffff;
            font-size: 20px;
            font-weight: bold;
            font-family: Arial, sans-serif;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.6);
            box-shadow: 0px 3px 6px rgba(0,0,0,0.3);
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn:hover {
            background: linear-gradient(to bottom, #62e063 0%, #3bc63d 50%, #2fa530 100%);
        }

        .btn::before {
            content: '▶';
            font-size: 16px;
        }

        .site-footer {
            margin-top: 40px;
            padding-bottom: 20px;
            font-size: 14px;
            color: #000000;
            width: 100%;
        }
    </style>
</head>
<body>

    <div id="loading-screen">
        <div class="loading-box">
            <h1>LOADING...</h1>
            <p id="loading-status">loading poem...</p>
            <div class="progress-container">
                <div class="progress-bar" id="progress-bar"></div>
            </div>
        </div>
    </div>

    <div id="page-wrapper">
        <div id="inner-frame">
            
            <!-- Snap-reveal overlays -->
            <div class="snap-tile" id="tile-half"></div>
            <div class="snap-tile" id="tile-quarter"></div>
            <div class="snap-tile" id="tile-eighth-1"></div>
            <div class="snap-tile" id="tile-eighth-2"></div>

            <div id="main-content">
                <div class="page-title">poem</div>

                <div class="poem-container">
                    <span class="poem-line" data-audio="line1.mp3">Devour found a lonely ape</span>
                    <span class="poem-line" data-audio="line2.mp3">Chewed his guts like bone</span>
                    <span class="poem-line" data-audio="line3.mp3">Swallowed raw inside his deep</span>
                    <span class="poem-line" data-audio="line4.mp3">Left him all alone</span>
                    <span class="poem-line" data-audio="line5.mp3">Blood was clotting in his veins</span>
                    <span class="poem-line" data-audio="line6.mp3">Curdling with a groan</span>
                </div>

                <div class="controls">
                    <button class="btn" id="play-full-btn">PLAY POEM</button>
                </div>

                <div class="site-footer">
                    <p>click text to play line</p>
                </div>
            </div>

        </div>
    </div>

    <script>
        const loadingScreen = document.getElementById('loading-screen');
        const progressBar = document.getElementById('progress-bar');
        const loadingStatus = document.getElementById('loading-status');
        const mainContent = document.getElementById('main-content');
        const playFullBtn = document.getElementById('play-full-btn');

        const tileHalf = document.getElementById('tile-half');
        const tileQuarter = document.getElementById('tile-quarter');
        const tileEighth1 = document.getElementById('tile-eighth-1');
        const tileEighth2 = document.getElementById('tile-eighth-2');

        const lines = document.querySelectorAll('.poem-line');
        let currentAudio = null;

        // Loading Bar Logic
        let progress = 0;
        const loadInterval = setInterval(() => {
            progress += 1;
            progressBar.style.width = progress + '%';

            if (progress === 30) {
                loadingStatus.textContent = 'fetching audio...';
            } else if (progress === 70) {
                loadingStatus.textContent = 'almost ready...';
            } else if (progress >= 100) {
                clearInterval(loadInterval);
                startSnapReveal();
            }
        }, 100);

        function startSnapReveal() {
            loadingScreen.style.display = 'none';
            mainContent.style.display = 'flex';

            setTimeout(() => { tileHalf.style.display = 'none'; }, 100);
            setTimeout(() => { tileQuarter.style.display = 'none'; }, 400);
            setTimeout(() => { tileEighth1.style.display = 'none'; }, 700);
            setTimeout(() => { tileEighth2.style.display = 'none'; }, 950);
        }

        function clearHighlights() {
            lines.forEach(l => l.classList.remove('playing'));
        }

        // Single line audio playback
        lines.forEach(line => {
            line.addEventListener('click', () => {
                const audioSrc = line.getAttribute('data-audio');
                if (audioSrc) {
                    if (currentAudio) {
                        currentAudio.pause();
                        currentAudio.currentTime = 0;
                    }

                    clearHighlights();
                    line.classList.add('playing');

                    currentAudio = new Audio(audioSrc);
                    currentAudio.play().catch(e => console.error("Audio playback error:", e));

                    currentAudio.onended = () => {
                        line.classList.remove('playing');
                    };
                }
            });
        });

        // Sequential Playback
        playFullBtn.addEventListener('click', () => {
            let index = 0;

            function playNextLine() {
                if (index < lines.length) {
                    const line = lines[index];
                    const audioSrc = line.getAttribute('data-audio');

                    clearHighlights();
                    line.classList.add('playing');

                    if (currentAudio) {
                        currentAudio.pause();
                        currentAudio.currentTime = 0;
                    }

                    currentAudio = new Audio(audioSrc);
                    currentAudio.play().catch(e => console.error("Audio playback error:", e));

                    currentAudio.onended = () => {
                        line.classList.remove('playing');
                        index++;
                        playNextLine();
                    };
                }
            }

            playNextLine();
        });
    </script>
</body>
</html>
